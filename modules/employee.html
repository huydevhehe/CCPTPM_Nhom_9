<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nhân viên - Quản lý đặt phòng</title>
  <link rel="stylesheet" href="employee.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-building"></i>
        <span>Booking System</span>
      </div>

      <nav>
        <ul>
          <li class="active"><i class="fas fa-calendar-check"></i> Đặt phòng mới</li>
          <li><i class="fas fa-list-check"></i> Danh sách đặt phòng</li>
          <li><i class="fas fa-bed"></i> Tình trạng phòng</li>
          <li><i class="fas fa-clock-rotate-left"></i> Lịch sử check-in/out</li>
          <li><i class="fas fa-money-bill-transfer"></i> Thanh toán & công nợ</li>
          <li><i class="fas fa-user-plus"></i> Khách hàng quen</li>
        </ul>
      </nav>

      <div class="user-info">
        <div class="avatar">NV</div>
        <div>
          <div class="name">Nguyễn Văn A</div>
          <div class="role">Nhân viên lễ tân</div>
        </div>
        <button class="logout-btn" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

      <header class="topbar">
        <h1>Đặt phòng mới</h1>
        <div class="topbar-right">
          <div class="search-box">
            <input type="text" placeholder="Tìm khách / mã đặt phòng..." id="searchInput">
            <i class="fas fa-search"></i>
          </div>
          <button class="btn-refresh"><i class="fas fa-sync-alt"></i></button>
          <span class="current-time" id="currentTime"></span>
        </div>
      </header>

      <!-- Booking Form -->
      <section class="booking-form-card">
        <form id="bookingForm">

          <div class="form-row">
            <div class="form-group">
              <label>Họ và tên khách <span class="required">*</span></label>
              <input type="text" id="customerName" required placeholder="Nguyễn Văn B" autocomplete="off">
            </div>
            <div class="form-group">
              <label>Số điện thoại <span class="required">*</span></label>
              <input type="tel" id="phone" required placeholder="090xxxxxxx">
            </div>
            <div class="form-group">
              <label>CMND/CCCD</label>
              <input type="text" id="idNumber" placeholder="012345678910">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Loại phòng <span class="required">*</span></label>
              <select id="roomType" required>
                <option value="">-- Chọn loại phòng --</option>
                <option value="single">Phòng đơn (Standard)</option>
                <option value="double">Phòng đôi (Double)</option>
                <option value="twin">Phòng đôi giường đơn (Twin)</option>
                <option value="family">Phòng gia đình</option>
                <option value="dorm">Giường dorm</option>
              </select>
            </div>

            <div class="form-group">
              <label>Số phòng khả dụng</label>
              <select id="roomNumber">
                <option value="">Chọn loại phòng trước</option>
              </select>
            </div>

            <div class="form-group small">
              <label>Số khách</label>
              <input type="number" id="guestCount" min="1" max="10" value="2">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Ngày nhận phòng <span class="required">*</span></label>
              <input type="date" id="checkInDate" required>
            </div>
            <div class="form-group">
              <label>Giờ nhận</label>
              <input type="time" id="checkInTime" value="14:00">
            </div>
            <div class="form-group">
              <label>Ngày trả phòng <span class="required">*</span></label>
              <input type="date" id="checkOutDate" required>
            </div>
            <div class="form-group">
              <label>Giờ trả</label>
              <input type="time" id="checkOutTime" value="12:00">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full">
              <label>Ghi chú / Yêu cầu đặc biệt</label>
              <textarea id="notes" rows="3" placeholder="Gần cửa sổ, không hút thuốc, cần nôi em bé, cháo dinh dưỡng,..."></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary">Hủy</button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-check"></i> Xác nhận đặt phòng
            </button>
          </div>

        </form>
      </section>

    </main>
  </div>

  <script src="employee.js"></script>
</body>
</html>
