<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý danh mục</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="top">
            <div class="title-wrap">
                <svg class="logo" width="40" height="40" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="#2563eb" />
                    <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="#06b6d4" />
                    <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="#34d399" />
                    <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" fill="#f59e0b" />
                </svg>
                <div>
                    <h1>Quản lý danh mục</h1>
                    <p class="subtitle">Thêm, sửa và xóa danh mục — dữ liệu lưu tạm trên trình duyệt.</p>
                </div>
            </div>
        </header>

        <main>
            <form id="addForm" class="input-row" autocomplete="off">
                <input id="nameInput" placeholder="Nhập tên danh mục, ví dụ: Thời trang" required>
                <button type="submit" class="primary">Thêm</button>
            </form>

            <ul id="list" class="items"></ul>
        </main>

        <footer>
            <p class="hint">Dữ liệu được lưu trong localStorage của trình duyệt. Không dùng cho dữ liệu quan trọng.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
